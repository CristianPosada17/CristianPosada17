<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Cristian Posada — Fundador de ProCode. Menos humo, más sistemas.">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(96,165,250,0.10)" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060B18" stop-opacity="0"/>
      <stop offset="1" stop-color="#060B18" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
    <style>
      .display { font-family: 'Space Grotesk', 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .body { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
      .pulse { animation: pulse 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .pulse2 { animation: pulse 7s ease-in-out infinite reverse; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .dot { animation: dot 2.4s ease-in-out infinite; }
      .dot.b { animation-delay: .8s; } .dot.c { animation-delay: 1.6s; }
      @keyframes dot { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#060B18"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse class="pulse" cx="230" cy="80" rx="420" ry="260" fill="url(#glowBlue)"/>
    <ellipse class="pulse2" cx="1010" cy="360" rx="380" ry="240" fill="url(#glowCyan)"/>
    <rect y="300" width="1200" height="120" fill="url(#fade)"/>

    <!-- Columna izquierda: identidad -->
    <g class="rise d1">
      <rect x="64" y="64" width="360" height="34" rx="17" fill="rgba(37,99,235,0.14)" stroke="rgba(96,165,250,0.35)"/>
      <circle cx="86" cy="81" r="5" fill="#10B981"/>
      <text x="100" y="86" class="mono" font-size="14" fill="#94A3B8" letter-spacing="1.5">SISTEMAS DIGITALES DE CRECIMIENTO</text>
    </g>

    <text x="62" y="172" class="display rise d2" font-size="68" font-weight="700" fill="#F1F5F9" letter-spacing="-1.5">Cristian Posada</text>
    <text x="64" y="224" class="display rise d3" font-size="34" font-weight="700" fill="url(#grad)">Fundador de ProCode</text>

    <g class="rise d4">
      <text x="64" y="280" class="body" font-size="21" fill="#F1F5F9">Sitios web y sistemas digitales para</text>
      <text x="64" y="309" class="body" font-size="21" fill="#F1F5F9">negocios de servicios profesionales.</text>
    </g>

    <g class="rise d5">
      <text x="64" y="364" class="mono" font-size="17" fill="#60A5FA">&gt; menos humo, más sistemas<tspan class="cursor" fill="#22D3EE">▍</tspan></text>
    </g>

    <!-- Columna derecha: tarjeta de código -->
    <g class="rise d3" transform="translate(690 70)">
      <rect width="446" height="282" rx="16" fill="#0A1224" stroke="rgba(148,163,184,0.14)"/>
      <rect width="446" height="282" rx="16" fill="none" stroke="url(#grad)" stroke-opacity="0.35"/>
      <path d="M0 16a16 16 0 0 1 16-16h414a16 16 0 0 1 16 16v26H0z" fill="rgba(148,163,184,0.06)"/>
      <circle cx="22" cy="21" r="6" fill="#F87171" fill-opacity=".85"/>
      <circle cx="42" cy="21" r="6" fill="#FBBF24" fill-opacity=".85"/>
      <circle cx="62" cy="21" r="6" fill="#10B981" fill-opacity=".85"/>
      <text x="223" y="26" class="mono" font-size="13" fill="#94A3B8" text-anchor="middle">procode.config.ts</text>

      <g class="mono" font-size="15.5">
        <text x="24" y="76"><tspan fill="#60A5FA">const</tspan><tspan fill="#F1F5F9"> procode = {</tspan></text>
        <text x="44" y="106"><tspan fill="#94A3B8">para:</tspan><tspan fill="#10B981"> "servicios profesionales"</tspan><tspan fill="#F1F5F9">,</tspan></text>
        <text x="44" y="136"><tspan fill="#94A3B8">entrego:</tspan><tspan fill="#F1F5F9"> [</tspan></text>
        <text x="66" y="164"><tspan fill="#38BDF8">"web"</tspan><tspan fill="#F1F5F9">, </tspan><tspan fill="#38BDF8">"formularios"</tspan><tspan fill="#F1F5F9">,</tspan></text>
        <text x="66" y="192"><tspan fill="#38BDF8">"agenda"</tspan><tspan fill="#F1F5F9">, </tspan><tspan fill="#38BDF8">"medición"</tspan></text>
        <text x="44" y="220"><tspan fill="#F1F5F9">],</tspan></text>
        <text x="44" y="250"><tspan fill="#94A3B8">respuesta:</tspan><tspan fill="#10B981"> "&lt; 24 h"</tspan><tspan fill="#F1F5F9">,</tspan></text>
        <text x="24" y="274"><tspan fill="#F1F5F9">};</tspan></text>
      </g>
    </g>

    <!-- Embudo: tres puntos -->
    <g transform="translate(690 378)" class="mono" font-size="14">
      <circle class="dot" cx="6" cy="-5" r="5" fill="#60A5FA"/>
      <text x="20" y="0" fill="#94A3B8">Te encuentran</text>
      <circle class="dot b" cx="164" cy="-5" r="5" fill="#3B82F6"/>
      <text x="178" y="0" fill="#94A3B8">Te entienden</text>
      <circle class="dot c" cx="314" cy="-5" r="5" fill="#22D3EE"/>
      <text x="328" y="0" fill="#94A3B8">Te escriben</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="23.5" fill="none" stroke="rgba(148,163,184,0.14)"/>
</svg>

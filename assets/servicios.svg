<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Servicios: sitio web profesional, landing page, soporte y mantenimiento mensual, SEO y marketing">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .display { font-family: 'Space Grotesk', 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .body { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    </style>
  </defs>

  <!-- 01 Sitio web profesional -->
  <g class="card">
    <rect x="1" y="1" width="588" height="248" rx="20" fill="#0A1224" stroke="rgba(148,163,184,0.14)"/>
    <rect x="1" y="1" width="588" height="248" rx="20" fill="url(#glow)"/>
    <text x="36" y="58" class="mono" font-size="16" fill="#60A5FA">// 01 · SERVICIO PRINCIPAL</text>
    <text x="36" y="108" class="display" font-size="32" font-weight="700" fill="#F1F5F9">Sitio web profesional</text>
    <text class="body" font-size="19" fill="#94A3B8">
      <tspan x="36" y="152">Programado a la medida, sin plantillas. Carga</tspan>
      <tspan x="36" y="180">rápido, sale en Google y convierte visitas en</tspan>
      <tspan x="36" y="208">llamadas, mensajes y citas agendadas.</tspan>
    </text>
  </g>

  <!-- 02 Landing page -->
  <g class="card c2" transform="translate(610 0)">
    <rect x="1" y="1" width="588" height="248" rx="20" fill="#0A1224" stroke="rgba(148,163,184,0.14)"/>
    <text x="36" y="58" class="mono" font-size="16" fill="#38BDF8">// 02</text>
    <text x="36" y="108" class="display" font-size="32" font-weight="700" fill="#F1F5F9">Landing page</text>
    <text class="body" font-size="19" fill="#94A3B8">
      <tspan x="36" y="152">Una página, una oferta, una acción. Ideal para</tspan>
      <tspan x="36" y="180">campañas, lanzamientos o tu servicio estrella,</tspan>
      <tspan x="36" y="208">con entrega desde una semana.</tspan>
    </text>
  </g>

  <!-- 03 Soporte -->
  <g class="card c3" transform="translate(0 270)">
    <rect x="1" y="1" width="588" height="248" rx="20" fill="#0A1224" stroke="rgba(148,163,184,0.14)"/>
    <text x="36" y="58" class="mono" font-size="16" fill="#22D3EE">// 03</text>
    <text x="36" y="108" class="display" font-size="32" font-weight="700" fill="#F1F5F9">Soporte y mantenimiento</text>
    <text class="body" font-size="19" fill="#94A3B8">
      <tspan x="36" y="152">Plan mensual: cambios, actualizaciones,</tspan>
      <tspan x="36" y="180">respaldos y mejoras continuas. Con alguien que</tspan>
      <tspan x="36" y="208">sí contesta, en menos de 24 horas.</tspan>
    </text>
  </g>

  <!-- 04 SEO y marketing -->
  <g class="card c4" transform="translate(610 270)">
    <rect x="1" y="1" width="588" height="248" rx="20" fill="#0A1224" stroke="rgba(148,163,184,0.14)"/>
    <text x="36" y="58" class="mono" font-size="16" fill="#10B981">// 04</text>
    <text x="36" y="108" class="display" font-size="32" font-weight="700" fill="#F1F5F9">SEO y marketing</text>
    <text class="body" font-size="19" fill="#94A3B8">
      <tspan x="36" y="152">SEO técnico y local desde el código, Perfil de</tspan>
      <tspan x="36" y="180">Google y campañas medidas por lo que importa:</tspan>
      <tspan x="36" y="208">llamadas, mensajes y citas.</tspan>
    </text>
  </g>
</svg>
